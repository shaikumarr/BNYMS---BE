spring.application.name=taskpulse

server.port=8080

# Database connection
spring.datasource.url=jdbc:mysql://localhost:3306/taskpulse_db
spring.datasource.username=root
spring.datasource.password=root@39

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

jwt.secret=ChangeThisToALongRandomSecretKeyAtLeast32CharactersLong12345
jwt.expiration-ms=86400000


# AI rewrite (Gemini). The key comes from an environment variable. Never hard-code it or commit it to Git.

gemini.model=gemini-2.5-flash

# Excel master file, created automatically on the first approval
taskpulse.excel.path=./reports/approved-updates.xlsx
